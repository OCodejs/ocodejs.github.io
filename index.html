<script>
const viewRoot=document.getElementById('view');
const names={overview:'Server Dashboard',agents:'AI Agents',api:'API Gateway',auth:'Authentication',mcp:'MCP Server',console:'Developer Console',docs:'Documentation'};
let current='overview',connections=[];
const CONTROL_API_BASE='https://ocodejs-server-api-staging.huynhthuongg2505-f9b.workers.dev/api/v1';
const MCP_ENDPOINT='https://ocodejs-mcp-staging.huynhthuongg2505-f9b.workers.dev/mcp';
const services=[['AI Agent Runtime','Điều phối tác vụ agent','Chưa kết nối','off','—'],['API Gateway','Định tuyến API & rate limits','Chưa kết nối','off','—'],['Identity / Auth','OAuth · session · account','Chưa kết nối','off','—'],['MCP Registry','Quản lý MCP endpoints','Chưa kết nối','off','—'],['Developer Telemetry','Logs · metrics · traces','Chưa kết nối','off','—']];
const endpoints=[['GET','/api/v1','API metadata và route index','STAGING LIVE'],['GET','/api/v1/health/live','Liveness probe','STAGING LIVE'],['GET','/api/v1/health/ready','Readiness probe','STAGING LIVE'],['GET','/api/v1/services','Service Registry','STAGING LIVE'],['GET','/api/v1/services/{serviceId}','Chi tiết một service','STAGING LIVE'],['GET','/api/v1/agents','Agent Registry (read-only)','STAGING LIVE'],['GET','/api/v1/agents/{agentId}','Agent definition versioned','STAGING LIVE']];
function header(kicker,title,desc,action=''){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+action+'</div>'}
function panel(title,body,extra=''){return '<section class="panel"><div class="panel-head"><strong>'+title+'</strong>'+extra+'</div>'+body+'</section>'}
function overview(){return header('SYSTEM OVERVIEW / 00','Server Dashboard','Trạng thái dịch vụ được lấy trực tiếp từ OCodeJS Control API trên môi trường staging.')+
'<div class="notice" id="apiNotice" role="status" aria-live="polite">Đang kết nối Control API staging để tải trạng thái dịch vụ…</div>'+
'<div class="grid stats"><div class="stat"><div class="stat-top">Healthy services <span>◌</span></div><div class="stat-value" id="healthyCount">— / —</div><div class="stat-foot" id="serviceCountNote">Đang kiểm tra kết nối</div></div><div class="stat"><div class="stat-top">AI Agents <span>✳</span></div><div class="stat-value">0 / 6</div><div class="stat-foot">Runtime chưa tích hợp</div></div><div class="stat"><div class="stat-top">Control API <span>⌘</span></div><div class="stat-value" id="apiStateValue">CHECKING</div><div class="stat-foot">Cloudflare Workers · staging</div></div><div class="stat"><div class="stat-top">MCP Connections <span>⛓</span></div><div class="stat-value">'+connections.length+'</div><div class="stat-foot">Chưa có MCP adapter</div></div></div>'+
'<div class="grid cols">'+panel('SERVICE STATUS','<div class="panel-body service-list" id="serviceStatus" aria-live="polite"><div class="empty">Đang tải dữ liệu từ API…</div></div>','<div style="display:flex;align-items:center;gap:8px"><small id="apiHealthStatus">CHECKING</small><button class="btn ghost" id="refreshServices" type="button">↻ Refresh</button></div>')+
panel('CONTROL API HEALTH','<div class="panel-body feed"><div class="feed-item"><i class="feed-dot"></i><div><b id="apiHealthTitle">Đang kiểm tra API</b><small id="apiHealthDetail">GET /api/v1/health/live</small></div></div><div class="feed-item"><i class="feed-dot"></i><div><b>Readiness probe</b><small id="apiReadyDetail">GET /api/v1/health/ready · đang chờ</small></div></div><div class="feed-item"><i class="feed-dot"></i><div><b>Last checked</b><small id="apiCheckedAt">Chưa có dữ liệu</small></div></div></div>','<small>STAGING</small>')+
'</div><div style="height:14px"></div><div class="grid cols">'+panel('INTEGRATION STATUS','<div class="panel-body feed"><div class="feed-item"><i class="feed-dot"></i><div><b>Control API</b><small>Đã triển khai trên Cloudflare Workers staging</small></div></div><div class="feed-item"><i class="feed-dot"></i><div><b>Identity · AI Runtime · MCP · Telemetry</b><small>Chưa tích hợp health adapter; không được tính là healthy</small></div></div></div>')+panel('QUICK ACCESS','<div class="panel-body feed"><button class="btn ghost" data-go="agents">Mở AI Agents →</button><button class="btn ghost" data-go="api">Xem API Catalog →</button><button class="btn ghost" data-go="mcp">Quản lý MCP →</button><button class="btn ghost" data-go="docs">Đọc tài liệu →</button></div>')+'</div>'}
async function refreshDashboard(){
 const button=document.getElementById('refreshServices');
 const notice=document.getElementById('apiNotice');
 if(!notice)return;
 if(button){button.disabled=true;button.textContent='… Checking';}
 const setText=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value;};
 try{
  const options={method:'GET',cache:'no-store',headers:{'Accept':'application/json'}};
  const responses=await Promise.all([
   fetch(CONTROL_API_BASE+'/health/live',options),
   fetch(CONTROL_API_BASE+'/health/ready',options),
   fetch(CONTROL_API_BASE+'/services',options)
  ]);
  if(responses.some(response=>!response.ok))throw new Error('HTTP '+responses.map(response=>response.status).join('/'));
  const bodies=await Promise.all(responses.map(response=>response.json()));
  const live=bodies[0],ready=bodies[1],registry=bodies[2];
  if(live.live!==true||ready.ready!==true||!Array.isArray(registry.services))throw new Error('API response schema is invalid');
  const labels={healthy:'HEALTHY',degraded:'DEGRADED',unavailable:'UNAVAILABLE',not_configured:'NOT CONFIGURED',unknown:'UNKNOWN'};
  const classes={healthy:'ok',degraded:'warn',unavailable:'off',not_configured:'off',unknown:'off'};
  const healthy=registry.services.filter(item=>item.state==='healthy').length;
  const target=document.getElementById('serviceStatus');
  if(target)target.innerHTML=registry.services.map(item=>'<div class="service"><div><b>'+escapeHtml(item.name)+'</b><small>'+escapeHtml(item.description)+'</small></div><span class="state '+(classes[item.state]||'off')+'">'+(labels[item.state]||'UNKNOWN')+'</span><span class="latency">'+(Number.isFinite(item.latencyMs)?item.latencyMs+' ms':'—')+'</span></div>').join('')||'<div class="empty">API chưa đăng ký dịch vụ nào.</div>';
  setText('healthyCount',healthy+' / '+registry.services.length);
  setText('serviceCountNote','Healthy theo Service Registry');
  setText('apiStateValue','ONLINE');
  setText('apiHealthStatus','API ONLINE');
  setText('apiHealthTitle','Control API đang phản hồi');
  setText('apiHealthDetail','HTTP '+responses[0].status+' · '+live.service+' · v'+live.version);
  setText('apiReadyDetail',ready.ready?'READY · stateless API':'NOT READY');
  setText('apiCheckedAt',new Date(registry.checkedAt||live.checkedAt||Date.now()).toLocaleString('vi-VN'));
  notice.textContent='Đã nhận dữ liệu thật từ Control API staging. '+healthy+'/'+registry.services.length+' dịch vụ được API đánh dấu healthy; các dịch vụ chưa cấu hình vẫn hiển thị riêng.';
  notice.style.borderColor='#275744';notice.style.background='#0d1915';notice.style.color='#9be2bf';
 }catch(error){
  const target=document.getElementById('serviceStatus');
  if(target)target.innerHTML='<div class="empty">Không tải được Service Registry. Kiểm tra kết nối mạng hoặc CORS, sau đó nhấn Refresh để thử lại.</div>';
  setText('healthyCount','— / —');setText('serviceCountNote','Không có dữ liệu xác thực');
  setText('apiStateValue','OFFLINE');setText('apiHealthStatus','API UNREACHABLE');
  setText('apiHealthTitle','Không xác minh được Control API');
  setText('apiHealthDetail','GET '+CONTROL_API_BASE+'/health/live');
  setText('apiReadyDetail','Readiness chưa xác minh');
  setText('apiCheckedAt','Lỗi: '+(error&&error.message?error.message:'network error'));
  notice.textContent='Không kết nối được Control API staging. Dashboard không hiển thị dữ liệu cũ hoặc tự gán trạng thái healthy.';
  notice.style.borderColor='#633b40';notice.style.background='#1b1013';notice.style.color='#f3a5ad';
 }finally{if(button){button.disabled=false;button.textContent='↻ Refresh';}}
}
function agentView(){return header('AI PLATFORM / 01','AI Agents','Agent Registry thật từ Control API; định nghĩa có version nhưng runtime chưa bật.','<button class="btn ghost" id="refreshAgents" type="button">↻ Refresh</button>')+'<div class="notice">Các định nghĩa bên dưới đang ở trạng thái DRAFT. Chưa cấu hình model provider, chưa cấp tool và chưa cho phép thực thi agent; không phát sinh lượt gọi AI hoặc chi phí inference.</div><div id="agentRegistry" class="grid cards"><div class="empty">Đang tải Agent Registry từ staging Control API…</div></div>'}

async function refreshAgentRegistry(){
 const target=document.getElementById('agentRegistry');
 const button=document.getElementById('refreshAgents');
 if(!target)return;
 if(button){button.disabled=true;button.textContent='… Loading';}
 try{
  const response=await fetch(CONTROL_API_BASE+'/agents',{method:'GET',cache:'no-store',headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const body=await response.json();
  if(!Array.isArray(body.agents))throw new Error('Agent Registry schema không hợp lệ');
  target.innerHTML=body.agents.map((agent,i)=>'<article class="panel tile"><div class="agent-row"><div class="agent-icon">'+['✳','⌘','◇'][i%3]+'</div><div><strong>'+escapeHtml(agent.name)+'</strong><small>'+escapeHtml(agent.id)+' · v'+escapeHtml(agent.version)+'</small></div></div><p style="margin-top:16px">'+escapeHtml(agent.description)+'</p><div class="tile-foot"><span class="state warn">'+escapeHtml(agent.status.toUpperCase())+'</span><span class="tag">RUNTIME DISABLED</span></div><p style="font-size:10px;color:var(--muted);margin-top:12px">Capabilities: '+agent.capabilities.map(escapeHtml).join(' · ')+'</p><p style="font-size:10px;color:var(--muted)">Provider: '+escapeHtml(agent.provider.state)+' · Tools: '+agent.tools.length+' · Approval required: '+(agent.approvalRequired?'YES':'NO')+'</p></article>').join('')||'<div class="empty">Agent Registry chưa có định nghĩa nào.</div>';
 }catch(error){
  target.innerHTML='<div class="empty">Không tải được Agent Registry từ staging API. Không hiển thị agent mẫu hoặc trạng thái giả. Lỗi: '+escapeHtml(error.message)+'</div>';
 }finally{if(button){button.disabled=false;button.textContent='↻ Refresh';}}
}
function apiView(){return header('NETWORK / 02','API Gateway','Các route Control API hiện đã triển khai trên Cloudflare Workers staging.')+'<div class="notice">Các route bên dưới là API đọc dữ liệu đã có trên staging. Agent Registry đã có GET-only; Auth và MCP mutation/run APIs vẫn chưa được triển khai.</div>'+panel('ENDPOINT CATALOG','<div class="table-wrap"><table class="table"><thead><tr><th>Method</th><th>Endpoint</th><th>Mô tả</th><th>Availability</th></tr></thead><tbody>'+endpoints.map(e=>'<tr><td><span class="method '+(e[0]==='POST'?'post':e[0]==='DELETE'?'delete':'')+'">'+e[0]+'</span></td><td class="api-path">'+e[1]+'</td><td>'+e[2]+'</td><td><span class="state off">'+e[3]+'</span></td></tr>').join('')+'</tbody></table></div>','<small>7 ROUTES</small>')+'<div style="height:14px"></div><div class="grid cards"><article class="panel tile"><h3>Authentication</h3><p>Bearer token hoặc session cookie; cần triển khai middleware và policy.</p><span class="tag">DESIGN REQUIRED</span></article><article class="panel tile"><h3>Rate limiting</h3><p>Giới hạn theo API key, user hoặc client ID; cấu hình Redis/edge storage.</p><span class="tag">DESIGN REQUIRED</span></article><article class="panel tile"><h3>Observability</h3><p>Request ID, structured logs, latency và error metrics.</p><span class="tag">DESIGN REQUIRED</span></article></div>'}
function authView(){return header('IDENTITY / 03','Authentication','Theo dõi riêng Account Portal và dịch vụ GitHub OAuth dành cho OCodeJS CLI.')+
'<div class="notice">ĐĂNG NHẬP TẠM KHÓA — Cloudflare Preview build đã thành công, nhưng chưa có PostgreSQL riêng và OAuth secrets; health endpoint chưa được xác minh. Không gửi mật khẩu, token hoặc OAuth secret tại trang này.</div>'+
'<div class="grid cols"><section class="panel"><div class="panel-head"><strong>ACCOUNT SIGN IN</strong><span class="state off">NOT READY</span></div><div class="panel-body"><div class="field"><label>Email address</label><input disabled placeholder="you@example.com"></div><div class="field" style="margin-top:12px"><label>Password</label><input disabled type="password" placeholder="••••••••••"></div><button class="btn" disabled style="width:100%;margin-top:16px;opacity:.45">Đăng nhập · chờ Auth.js Preview</button><div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" disabled style="flex:1;opacity:.45">Continue with GitHub</button><button class="btn ghost" disabled style="flex:1;opacity:.45">Continue with Google</button></div><p style="font-size:9px;color:var(--muted);line-height:1.7;margin-top:14px">Không kết nối form này với CLI PAT/OAuth. Hai hệ thống có mục đích và session riêng.</p></div></section>'+
'<section class="panel"><div class="panel-head"><strong>AUTH SERVICE HEALTH</strong><button class="btn ghost" id="refreshAuth" type="button">↻ Refresh</button></div><div class="panel-body service-list"><div class="service"><div><b>Account Portal · Auth.js</b><small id="accountAuthDetail">Backend chưa được triển khai</small></div><span class="state off" id="accountAuthStatus">NOT CONFIGURED</span></div><div class="service"><div><b>OCodeJS CLI · GitHub OAuth/PAT</b><small id="cliAuthDetail">Đang kiểm tra health endpoint…</small></div><span class="state off" id="cliAuthStatus">CHECKING</span></div><p id="authCheckedAt" style="font-size:9px;color:var(--muted);line-height:1.7">Health status được lấy từ Control API staging.</p></div></section></div>'}
async function refreshAuthReadiness(){
 const button=document.getElementById('refreshAuth');
 if(button)button.onclick=refreshAuthReadiness;
 const setText=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value;};
 const setState=(id,state)=>{const el=document.getElementById(id);if(!el)return;el.textContent=state.toUpperCase().replace('_',' ');el.className='state '+(state==='healthy'?'ok':state==='degraded'?'warn':'off');};
 if(button){button.disabled=true;button.textContent='… Checking';}
 try{
  const options={method:'GET',cache:'no-store',headers:{'Accept':'application/json'}};
  const [identityResponse,cliResponse]=await Promise.all([
   fetch(CONTROL_API_BASE+'/services/identity',options),
   fetch(CONTROL_API_BASE+'/services/cli-auth',options)
  ]);
  if(!identityResponse.ok||!cliResponse.ok)throw new Error('HTTP '+identityResponse.status+'/'+cliResponse.status);
  const [identity,cli]=await Promise.all([identityResponse.json(),cliResponse.json()]);
  setState('accountAuthStatus',identity.service.state);
  setText('accountAuthDetail',identity.service.description);
  setState('cliAuthStatus',cli.service.state);
  setText('cliAuthDetail',cli.service.description);
  setText('authCheckedAt','Last checked: '+new Date(cli.service.checkedAt||Date.now()).toLocaleString('vi-VN'));
 }catch(error){
  setState('accountAuthStatus','not_configured');
  setText('accountAuthDetail','Auth.js Preview chưa được xác minh.');
  setState('cliAuthStatus','unknown');
  setText('cliAuthDetail','Không lấy được trạng thái từ Control API.');
  setText('authCheckedAt','Lỗi kiểm tra: '+(error&&error.message?error.message:'network error'));
 }finally{if(button){button.disabled=false;button.textContent='↻ Refresh';}}
}
function mcpView(){return header('CONNECTIVITY / 04','MCP Server','MCP staging endpoint đã được triển khai riêng; hãy chạy handshake để xác minh giao thức từ trình duyệt.', '<button class="btn" id="addConnection">＋ Thêm connection</button>')+
panel('STAGING MCP ENDPOINT','<div class="panel-body"><div class="service"><div><b>OCode.js Control Center MCP</b><small><code>https://ocodejs-mcp-staging.huynhthuongg2505-f9b.workers.dev/mcp</code></small></div><span class="state warn" id="mcpStatus">HANDSHAKE PENDING</span></div><div class="filters" style="margin-top:15px"><button class="active" id="mcpInitialize">▶ Initialize</button><button id="mcpTools">Tools / List</button></div><pre id="mcpResult" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#080d14;border:1px solid #293548;padding:12px;color:#aebbd0;font-size:10px;line-height:1.7;margin:14px 0 0">Worker đã được upload và bật workers.dev. Chưa có xác nhận handshake HTTP độc lập.</pre></div>','<small>ISOLATED STAGING</small>')+
'<div style="height:14px"></div>'+panel('MCP CONNECTIONS',connections.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Type</th><th>Endpoint</th><th>Status</th></tr></thead><tbody>'+connections.map(c=>'<tr><td>'+escapeHtml(c.name)+'</td><td>'+escapeHtml(c.type)+'</td><td><code>'+escapeHtml(c.url||'Not provided')+'</code></td><td><span class="state warn">PREVIEW ONLY</span></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Chưa có MCP connection tùy chỉnh trong phiên preview.</div>','<small>'+connections.length+' LOCAL ITEMS</small>')+
'<div style="height:14px"></div><div class="grid cards"><article class="panel tile"><h3>Transport</h3><p>Streamable HTTP, JSON-RPC 2.0; endpoint chỉ nhận POST.</p><span class="tag">MCP TRANSPORT</span></article><article class="panel tile"><h3>Read-only tools</h3><p>Đọc trạng thái Control API và danh sách service. Không có công cụ ghi/xóa.</p><span class="tag">2 TOOLS</span></article><article class="panel tile"><h3>Security boundary</h3><p>Đích backend cố định; không nhận URL tùy ý, không truy cập secrets hoặc DNS.</p><span class="tag">ALLOWLIST</span></article></div>'}
function consoleView(){return header('OBSERVABILITY / 05','Developer Console','Logs, monitoring và integrations. Chưa có telemetry pipeline hoặc log stream kết nối.')+'<div class="notice">Không có log hệ thống thật được truy xuất. Dòng bên dưới là event trạng thái của giao diện preview.</div><div class="grid stats"><div class="stat"><div class="stat-top">Error rate</div><div class="stat-value">N/A</div><div class="stat-foot">No telemetry source</div></div><div class="stat"><div class="stat-top">P95 latency</div><div class="stat-value">N/A</div><div class="stat-foot">No request metrics</div></div><div class="stat"><div class="stat-top">Events</div><div class="stat-value">03</div><div class="stat-foot">Local preview events</div></div><div class="stat"><div class="stat-top">Integrations</div><div class="stat-value">0</div><div class="stat-foot">Not configured</div></div></div><div class="grid cols">'+panel('PREVIEW EVENT LOG','<div class="panel-body"><div class="log"><span>LOCAL</span><code>INFO</code><span>Control Center interface mounted</span></div><div class="log"><span>LOCAL</span><code>INFO</code><span>API catalog rendered</span></div><div class="log"><span>LOCAL</span><code>WARN</code><span>Backend telemetry adapter not configured</span></div><div class="log"><span>LOCAL</span><code>WARN</code><span>Authentication provider unavailable</span></div></div>','<small>LOCAL ONLY</small>')+panel('INTEGRATIONS','<div class="panel-body service-list">'+[['GitHub','Repository & CI status'],['Cloudflare','Workers / Pages'],['Vercel','Preview deployments'],['OpenTelemetry','Logs · metrics · traces'],['PostgreSQL / Redis','Persistence & cache']].map(x=>'<div class="service"><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div><span class="state off">NOT CONNECTED</span></div>').join('')+'</div>')+'</div>'}
function docsView(){const docs=[['Getting Started','Tổng quan kiến trúc, yêu cầu runtime và cách khởi tạo môi trường.','/docs/getting-started'],['Server Architecture','Control plane, API layer, agent runtime và service adapters.','/docs/architecture'],['API Reference','Quy ước endpoint, request schema, auth và error response.','/docs/api'],['AI Agents','Provider configuration, agent lifecycle và orchestration.','/docs/agents'],['Authentication','OAuth, session management, account và access policy.','/docs/authentication'],['MCP Integration','MCP transport, initialize, tools/list và connection security.','/docs/mcp'],['Observability','Structured logging, metrics, tracing và alerting.','/docs/observability'],['Deployment','Environment variables, secrets, staging và production release.','/docs/deployment']];return header('KNOWLEDGE BASE / 06','Documentation','Tài liệu kỹ thuật và hướng dẫn tích hợp. Các trang con là cấu trúc đề xuất; nội dung chi tiết đang được xây dựng.')+'<div class="notice">Tài liệu trong danh mục này chưa được publish thành các trang riêng. Liên kết hiện mở repository để theo dõi source và cập nhật.</div><div class="doc-list">'+docs.map(d=>'<a class="doc" href="https://github.com/OCodejs/ocodejs.github.io" target="_blank" rel="noreferrer"><strong>'+d[0]+'</strong><p>'+d[1]+'</p><span>'+d[2]+' ↗</span></a>').join('')+'</div><div style="height:14px"></div>'+panel('PROJECT LINKS','<div class="panel-body feed"><a href="https://github.com/OCodejs" target="_blank" rel="noreferrer">OCode.js organization ↗</a><a href="https://github.com/OCodejs/ocodejs.github.io" target="_blank" rel="noreferrer">Control Center source ↗</a><a href="https://github.com/zskbot/ocodejs-cli" target="_blank" rel="noreferrer">OCode.js CLI ↗</a></div>')}
const renderers={overview,agents:agentView,api:apiView,auth:authView,mcp:mcpView,console:consoleView,docs:docsView};
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function navigate(key){if(!renderers[key])return;current=key;document.getElementById('crumb').textContent=names[key];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===key));viewRoot.innerHTML=renderers[key]();document.getElementById('globalSearch').value='';document.getElementById('sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});bindView();if(key==='overview')refreshDashboard();if(key==='agents')refreshAgentRegistry();if(key==='auth')refreshAuthReadiness()}
async function runMcpCheck(method){const output=document.getElementById('mcpResult'),status=document.getElementById('mcpStatus');if(!output||!status)return;output.textContent='Đang gửi '+method+'…';status.textContent='CHECKING';try{const response=await fetch(MCP_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json, text/event-stream','MCP-Protocol-Version':'2025-03-26'},body:JSON.stringify({jsonrpc:'2.0',id:method==='initialize'?101:102,method,params:method==='initialize'?{protocolVersion:'2025-03-26',capabilities:{},clientInfo:{name:'ocodejs-control-center',version:'1.0.0'}}:{}})});const data=await response.json();if(!response.ok||data.error)throw new Error(data.error?.message||('HTTP '+response.status));if(method==='initialize'){status.textContent='INITIALIZE OK';output.textContent=JSON.stringify(data,null,2);await fetch(MCP_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json, text/event-stream','MCP-Protocol-Version':'2025-03-26'},body:JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized'})});}else{const tools=data.result?.tools||[];status.textContent='TOOLS '+tools.length;output.textContent=tools.map(tool=>tool.name+' — '+tool.description).join('\n')||'No tools returned';}}catch(error){status.textContent='UNVERIFIED';output.textContent='MCP smoke test failed: '+error.message+'\nKiểm tra CORS, endpoint và trạng thái Worker.';}}
function bindView(){viewRoot.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.go)));const refresh=document.getElementById('refreshServices');if(refresh)refresh.addEventListener('click',refreshDashboard);const refreshAgents=document.getElementById('refreshAgents');if(refreshAgents)refreshAgents.addEventListener('click',refreshAgentRegistry);const add=document.getElementById('addConnection')||document.getElementById('addConnectionEmpty');if(add)add.addEventListener('click',openModal);const mcpInit=document.getElementById('mcpInitialize');if(mcpInit)mcpInit.addEventListener('click',()=>runMcpCheck('initialize'));const mcpTools=document.getElementById('mcpTools');if(mcpTools)mcpTools.addEventListener('click',()=>runMcpCheck('tools/list'));viewRoot.querySelectorAll('[data-connect]').forEach(b=>b.addEventListener('click',()=>{navigate('mcp');openModal();document.getElementById('connName').value=b.dataset.connect+' provider'}))}
function openModal(){document.getElementById('modal').classList.add('show');document.getElementById('connName').focus()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('cancelModal').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.getElementById('connectionForm').addEventListener('submit',e=>{e.preventDefault();connections.push({name:document.getElementById('connName').value,type:document.getElementById('connType').value,url:document.getElementById('connUrl').value});closeModal();e.target.reset();navigate('mcp')});
document.getElementById('globalSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();viewRoot.querySelectorAll('.service,.tile,.doc,.table tbody tr,.feed-item,.log').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')});
navigate('overview');
</script>

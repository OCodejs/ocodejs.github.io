<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0;url=https://ocodejs.github.io/cli-hub/">
  <link rel="canonical" href="https://ocodejs.github.io/cli-hub/">
  <title>OCodeJS CLI Hub — Redirecting</title>
  <style>
    :root{color-scheme:dark;background:#05070f;color:#f3f5fb;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,640px);border:1px solid #303746;padding:28px}
    h1{font-size:clamp(20px,5vw,30px);margin:0 0 12px}
    p{color:#aab3c2;line-height:1.7}
    a{display:inline-block;color:#fff;border:1px solid #fff;padding:12px 16px;text-decoration:none}
  </style>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <!-- Vercel Web Analytics -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
  <main>
    <h1>OCodeJS CLI Hub</h1>
    <p>Đang chuyển đến trang GitHub Pages chính thức của OCodeJS CLI Hub.</p>
    <p>Nếu trình duyệt không tự chuyển, hãy mở liên kết bên dưới.</p>
    <a href="https://ocodejs.github.io/cli-hub/">MỞ OCODEJS CLI HUB</a>
  </main>
  <script>window.location.replace("https://ocodejs.github.io/cli-hub/");</script>
</body>
</html>

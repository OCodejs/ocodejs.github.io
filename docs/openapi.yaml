openapi: 3.1.0
info:
  title: OCodeJS Control API
  version: 1.7.0
  description: Read-only health and service registry API with structured request logging. Staging implementation.
servers:
  - url: https://ocodejs-server-api-staging.huynhthuongg2505-f9b.workers.dev
paths:
  /api/v1:
    get:
      summary: API metadata
      responses:
        "200":
          description: API metadata and supported routes
          content:
            application/json:
              schema:
                type: object
                required: [name, version, status, routes, requestId]
                properties:
                  name: { type: string }
                  version: { type: string }
                  status: { type: string, enum: [preview] }
                  routes:
                    type: array
                    items: { type: string }
                  requestId: { type: string }
  /api/v1/health/live:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Worker process can respond
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/health/ready:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Stateless API slice is ready
          content:
            application/json:
              schema:
                type: object
                required: [service, state, ready, checkedAt, dependencies, requestId]
                properties:
                  service: { type: string }
                  state: { type: string, enum: [ready] }
                  ready: { type: boolean, const: true }
                  checkedAt: { type: string, format: date-time }
                  dependencies:
                    type: array
                    items: { type: object }
                  note: { type: string }
                  requestId: { type: string }
  /api/v1/services:
    get:
      summary: List registered service states
      responses:
        "200":
          description: Service registry snapshot
          content:
            application/json:
              schema:
                type: object
                required: [services, count, checkedAt, requestId]
                properties:
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
                  count: { type: integer }
                  checkedAt: { type: string, format: date-time }
                  requestId: { type: string }
  /api/v1/runtime/status:
    get:
      summary: Read AI runtime readiness without executing agents
      responses:
        "200":
          description: Provider and run-store readiness; inference and run lifecycle are disabled until configured
          content:
            application/json:
              schema:
                type: object
                required: [runtime, checkedAt, requestId]
                properties:
                  runtime:
                    type: object
                    required: [state, provider, availableProviders, runStore, executionEnabled, runLifecycle, approvalRequired, reason]
                    properties:
                      state: { type: string, enum: [not_configured] }
                      provider:
                        type: object
                        required: [id, state]
                        properties:
                          id: { type: [string, "null"] }
                          state: { type: string, enum: [not_configured] }
                      availableProviders:
                        type: array
                        items: { type: string }
                      runStore:
                        type: object
                        required: [state]
                        properties:
                          state: { type: string, enum: [not_configured] }
                      executionEnabled: { type: boolean, const: false }
                      runLifecycle: { type: string, enum: [disabled] }
                      approvalRequired: { type: boolean, const: true }
                      reason: { type: string }
                  checkedAt: { type: string, format: date-time }
                  requestId: { type: string }
  /api/v1/providers:
    get:
      summary: List AI provider adapter catalog
      responses:
        "200":
          description: Read-only provider catalog; inference remains disabled
          content:
            application/json:
              schema:
                type: object
                required: [providers, count, checkedAt, requestId]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
                  count: { type: integer }
                  checkedAt: { type: string, format: date-time }
                  requestId: { type: string }
  /api/v1/providers/{providerId}:
    get:
      summary: Get one provider adapter
      parameters:
        - in: path
          name: providerId
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
      responses:
        "200":
          description: Provider metadata
          content:
            application/json:
              schema:
                type: object
                required: [provider, requestId]
                properties:
                  provider:
                    $ref: "#/components/schemas/Provider"
                  requestId: { type: string }
        "404":
          description: Provider is not registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/agents:
    get:
      summary: List versioned agent definitions
      responses:
        "200":
          description: Read-only Agent Registry snapshot
          content:
            application/json:
              schema:
                type: object
                required: [agents, count, checkedAt, requestId]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentDefinition"
                  count: { type: integer }
                  checkedAt: { type: string, format: date-time }
                  requestId: { type: string }
  /api/v1/agents/{agentId}:
    get:
      summary: Get one versioned agent definition
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
      responses:
        "200":
          description: Agent definition
          content:
            application/json:
              schema:
                type: object
                required: [agent, requestId]
                properties:
                  agent:
                    $ref: "#/components/schemas/AgentDefinition"
                  requestId: { type: string }
        "404":
          description: Agent is not registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/mcp/connections:
    get:
      summary: List fixed, read-only MCP connection registry
      responses:
        "200":
          description: Staging MCP connection metadata and live protocol probe
          content:
            application/json:
              schema:
                type: object
                required: [connections, count, checkedAt, requestId]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/McpConnection"
                  count: { type: integer }
                  checkedAt: { type: string, format: date-time }
                  requestId: { type: string }
  /api/v1/mcp/connections/{connectionId}:
    get:
      summary: Read one fixed MCP connection
      parameters:
        - in: path
          name: connectionId
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
      responses:
        "200":
          description: MCP connection metadata and live protocol probe
          content:
            application/json:
              schema:
                type: object
                required: [connection, requestId]
                properties:
                  connection:
                    $ref: "#/components/schemas/McpConnection"
                  requestId: { type: string }
        "404":
          description: MCP connection is not registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/services/{serviceId}:
    get:
      summary: Get one registered service
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
      responses:
        "200":
          description: Service metadata and state
          content:
            application/json:
              schema:
                type: object
                required: [service, requestId]
                properties:
                  service:
                    $ref: "#/components/schemas/Service"
                  requestId: { type: string }
        "404":
          description: Service is not registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Health:
      type: object
      required: [service, state, live, checkedAt, version, requestId]
      properties:
        service: { type: string }
        state: { type: string, enum: [healthy] }
        live: { type: boolean, const: true }
        checkedAt: { type: string, format: date-time }
        version: { type: string }
        requestId: { type: string }
    Service:
      type: object
      required: [id, name, description, state, source, checkedAt, latencyMs]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        state:
          type: string
          enum: [healthy, degraded, unavailable, not_configured, unknown]
        source: { type: string, enum: [self, unverified, remote_probe] }
        checkedAt: { type: [string, "null"], format: date-time }
        latencyMs: { type: [integer, "null"], minimum: 0 }
    Provider:
      type: object
      required: [id, name, kind, state, description, capabilities, executionEnabled, requiresExplicitEnablement]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [managed_inference] }
        state: { type: string, enum: [not_configured] }
        description: { type: string }
        capabilities:
          type: array
          items: { type: string }
        executionEnabled: { type: boolean, const: false }
        requiresExplicitEnablement: { type: boolean, const: true }
    AgentDefinition:
      type: object
      required: [id, name, version, status, description, provider, capabilities, tools, executionEnabled, approvalRequired]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
        status: { type: string, enum: [draft] }
        description: { type: string }
        provider:
          type: object
          required: [id, state]
          properties:
            id: { type: [string, "null"] }
            state: { type: string, enum: [not_configured] }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { type: string }
        executionEnabled: { type: boolean, const: false }
        approvalRequired: { type: boolean, const: true }
    McpConnection:
      type: object
      required: [id, name, endpoint, transport, environment, access, managed, state, description, checkedAt, latencyMs]
      properties:
        id: { type: string }
        name: { type: string }
        endpoint: { type: string, format: uri }
        transport: { type: string, enum: [streamable-http] }
        environment: { type: string, enum: [staging] }
        access: { type: string, enum: [read_only] }
        managed: { type: boolean, const: false }
        state: { type: string, enum: [healthy, unknown, unavailable] }
        description: { type: string }
        checkedAt: { type: string, format: date-time }
        latencyMs: { type: integer, minimum: 0 }
        toolCount: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: [object, "null"] }
        requestId: { type: string }

# Diagnostic branch only; this workflow does not deploy or modify Ask OCodeJS. Re-run after ESLint cleanup.
name: Ask OCodeJS source validation (alternate runner)

on:
  push:
    branches:
      - test/ask-ocodejs-source-validation-20261117

permissions:
  contents: write

concurrency:
  group: ask-ocodejs-source-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clone public Ask OCodeJS source
        run: git clone --depth 1 --branch fix/restore-eslint-flat-config https://github.com/zskbot/ask-ocodejs.git ask-ocodejs
      - name: Install Ask OCodeJS dependencies
        working-directory: ask-ocodejs
        run: npm ci --no-audit --no-fund
      - name: Apply non-breaking dependency security updates
        working-directory: ask-ocodejs
        run: npm audit fix
        continue-on-error: true
      - name: Capture remaining dependency audit
        working-directory: ask-ocodejs
        run: npm audit --json > audit.json || true
      - name: Run Ask OCodeJS tests
        working-directory: ask-ocodejs
        run: npm test
      - name: Run Ask OCodeJS lint
        working-directory: ask-ocodejs
        run: npm run lint
      - name: Build Ask OCodeJS for GitHub Pages
        working-directory: ask-ocodejs
        run: npm run build -- --base=/ask-ocodejs/
      - name: Verify built Pages assets
        working-directory: ask-ocodejs
        run: |
          test -s dist/index.html
          grep -q '/ask-ocodejs/assets/' dist/index.html
          find dist/assets -maxdepth 1 -type f -name '*.js' -size +0c | grep -q .
      - name: Export audited Ask dependency files to diagnostic branch
        if: always()
        run: |
          mkdir -p .diagnostics/ask-ocodejs
          cp ask-ocodejs/package.json .diagnostics/ask-ocodejs/package.json
          cp ask-ocodejs/package-lock.json .diagnostics/ask-ocodejs/package-lock.json
          cp ask-ocodejs/audit.json .diagnostics/ask-ocodejs/audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/ask-ocodejs
          if git diff --cached --quiet; then
            echo "No dependency file changes to export"
          else
            git commit -m "chore: export Ask OCodeJS dependency audit [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload candidate dependency lockfile and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ask-ocodejs-dependency-audit
          path: |
            ask-ocodejs/package.json
            ask-ocodejs/package-lock.json
            ask-ocodejs/audit.json

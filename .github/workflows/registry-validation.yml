name: Project Registry Validation

on:
  pull_request:
    paths:
      - "projects.registry.json"
      - "scripts/check-project-registry.mjs"
      - ".github/workflows/registry-validation.yml"
  push:
    branches: [main]
    paths:
      - "projects.registry.json"
      - "scripts/check-project-registry.mjs"
      - ".github/workflows/registry-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository registry
        run: node scripts/check-project-registry.mjs

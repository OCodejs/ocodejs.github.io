name: OCodeJS AutoRun Event Bridge

on:
  workflow_run:
    types: [requested, in_progress, completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: autorun-event-${{ github.event.workflow_run.id }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish run lifecycle to OCodeJS Control API
        env:
          API_BASE: https://ocodejs-autorun-control-staging.ocodejs-df1.workers.dev
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.API_BASE;
          if (!base) throw new Error("Repository variable AUTORUN_CONTROL_API is not configured");
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set("audience", "ocodejs-autorun-staging");
          const tokenResponse = await fetch(tokenUrl, {
            headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }
          });
          if (!tokenResponse.ok) throw new Error(`GitHub OIDC token request failed: HTTP ${tokenResponse.status}`);
          const { value } = await tokenResponse.json();
          const event = JSON.parse(process.env.EVENT_JSON);
          const response = await fetch(new URL("/api/v1/autorun/events", base), {
            method: "POST",
            headers: {
              authorization: `Bearer ${value}`,
              "content-type": "application/json"
            },
            body: JSON.stringify(event.workflow_run ? event : {})
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`OCodeJS Control API rejected event: HTTP ${response.status} ${body}`);
          process.stdout.write(body + "\n");
          NODE

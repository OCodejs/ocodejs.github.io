name: MCP staging worker checks

on:
  pull_request:
    branches: [main]
    paths:
      - "workers/mcp-server/**"
      - ".github/workflows/mcp-server-tests.yml"
  push:
    branches: [main]
    paths:
      - "workers/mcp-server/**"
      - ".github/workflows/mcp-server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-staging-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test MCP Worker
        run: node --test workers/mcp-server/worker.test.mjs

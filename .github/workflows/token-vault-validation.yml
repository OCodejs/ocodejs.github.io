name: Token Vault validation

on:
  pull_request:
    paths:
      - "security/token-vault/**"
      - ".github/workflows/token-vault-validation.yml"
  push:
    branches: [main]
    paths:
      - "security/token-vault/**"
      - ".github/workflows/token-vault-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker and password utility
        run: node security/token-vault/scripts/check-source.mjs
      - name: Validate D1 schema
        run: |
          node --input-type=module <<'NODE'
          import { DatabaseSync } from 'node:sqlite';
          import { readFileSync } from 'node:fs';
          const db = new DatabaseSync(':memory:');
          db.exec(readFileSync('security/token-vault/schema.sql', 'utf8'));
          db.close();
          console.log('D1-compatible schema syntax passed.');
          NODE
      - name: Run Worker smoke and integration tests
        run: node --test security/token-vault/tests/*.test.mjs

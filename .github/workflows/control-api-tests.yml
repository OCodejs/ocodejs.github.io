name: Control API and dashboard checks

on:
  pull_request:
    paths:
      - "workers/control-api/**"
      - "workers/mcp-server/**"
      - "index.html"
      - "scripts/check-control-center.mjs"
      - "scripts/check-pages-theme.mjs"
      - "scripts/check-accessibility.mjs"
      - "scripts/check-doc-links.mjs"
      - "scripts/check-mcp-staging.mjs"
      - "ocodejs-pages-theme.css"
      - "docs/**"
      - "README.md"
      - ".github/workflows/control-api-tests.yml"
  push:
    branches: [main]
    paths:
      - "workers/control-api/**"
      - "workers/mcp-server/**"
      - "index.html"
      - "scripts/check-control-center.mjs"
      - "scripts/check-pages-theme.mjs"
      - "scripts/check-accessibility.mjs"
      - "scripts/check-doc-links.mjs"
      - "ocodejs-pages-theme.css"
      - "docs/**"
      - "README.md"
      - ".github/workflows/control-api-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Control API tests
        run: node --test workers/control-api/worker.test.mjs workers/control-api/telemetry.test.mjs
      - name: Run MCP server tests
        run: node --test workers/mcp-server/worker.test.mjs
      - name: Validate Control Center JavaScript
        run: node scripts/check-control-center.mjs
      - name: Validate OCode.js Pages theme
        run: node scripts/check-pages-theme.mjs
      - name: Validate static accessibility requirements
        run: node scripts/check-accessibility.mjs
      - name: Validate local Markdown links
        run: node scripts/check-doc-links.mjs
      - name: Verify external staging MCP handshake and read-only tool list
        run: node scripts/check-mcp-staging.mjs

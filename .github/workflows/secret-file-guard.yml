name: Secret file tracking guard

on:
  pull_request:
    paths:
      - ".gitignore"
      - ".env*"
      - "**/.env*"
      - ".dev.vars*"
      - "**/.dev.vars*"
      - "scripts/check-no-tracked-env-files.mjs"
      - ".github/workflows/secret-file-guard.yml"
  push:
    branches: [main]
    paths:
      - ".gitignore"
      - ".env*"
      - "**/.env*"
      - ".dev.vars*"
      - "**/.dev.vars*"
      - "scripts/check-no-tracked-env-files.mjs"
      - ".github/workflows/secret-file-guard.yml"

permissions:
  contents: read

jobs:
  tracked-secret-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject tracked local environment files
        run: node scripts/check-no-tracked-env-files.mjs

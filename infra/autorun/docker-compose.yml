name: ocodejs-git-staging
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: \${FORGEJO_DB_PASSWORD:?Set FORGEJO_DB_PASSWORD in the host environment}
    volumes:
      - forgejo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [git-internal]
  git:
    image: codeberg.org/forgejo/forgejo:11.0.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: database:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: \${FORGEJO_DB_PASSWORD:?Set FORGEJO_DB_PASSWORD in the host environment}
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_DOMAIN: localhost
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__security__INSTALL_LOCK: "false"
      FORGEJO__actions__ENABLED: "true"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:22"
    volumes:
      - forgejo-data:/data
    networks: [git-internal]
volumes:
  forgejo-postgres:
  forgejo-data:
networks:
  git-internal:
    internal: true
